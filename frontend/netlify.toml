[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 1) Proxy API calls to Render so the browser only talks to ONE origin (keeps cookies first-party,
#    which is required for iPhone Safari). EDIT the URL below to your Render service URL.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-SERVICE-NAME.onrender.com/api/:splat"
  status = 200
  force = true

# 2) Single-page-app fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
